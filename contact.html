<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contact Travel</title>
</head>
<body>

    <div class="container">
        <nav class="navbar">
            <div class="nav-right">
                <a href="index.html">Home</a>
                <a href="quiz.html">Quiz</a>
                <a href="contact.html" class="is-active">Contact</a>
            </div>
        </nav>
    </div>

    <header class="contact-hero">
        <div class="contact-blob blob-1" aria-hidden="true"></div>
        <div class="contact-blob blob-2" aria-hidden="true"></div>
        <div class="contact-blob blob-3" aria-hidden="true"></div>

        <div class="contact-hero-inner">
            <p class="eyebrow" data-anim="eyebrow">Contact</p>
            <h1 data-anim="heading">Vind je <span class="accent-word" data-word>sport</span>-contact</h1>
          
            <div class="chip-tabs" role="tablist" aria-label="Kies een categorie" data-anim="extra">
                <span class="chip-indicator" aria-hidden="true"></span>
                <button class="chip" type="button" role="tab" data-cat="sport" aria-selected="true">
                    <span class="chip-dot" style="--dot: var(--c-sport)"></span>Sport
                </button>
                <button class="chip" type="button" role="tab" data-cat="voeding" aria-selected="false">
                    <span class="chip-dot" style="--dot: var(--c-voeding)"></span>Voeding
                </button>
                <button class="chip" type="button" role="tab" data-cat="mentaal" aria-selected="false">
                    <span class="chip-dot" style="--dot: var(--c-mentaal)"></span>Mentaal
                </button>
            </div>

        </div>
    </header>

    <main class="contact-main">
        <div class="contact-card" id="contactCard" aria-live="polite">
        <!-- zie contact.js -->
        </div>
    </main>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="contact.js"></script>


        <footer class="site-footer">
        <span class="footer-brand">Travel</span>
        <ul class="footer-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="quiz.html">Quiz</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </footer>

    
</body>
</html>
